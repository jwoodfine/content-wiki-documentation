  # technical foundation, analytics engine — not merged.
  # A more serious defect surfaced while verifying claims against real code: 4 of the
  # 5 articles cited [[co-location-methodology]] as "the retail cluster tier scoring
  # methodology," but that slug resolves to architecture/co-location-methodology.md —
  # a real, unrelated article about data-center FACILITY co-location, not retail
  # anchors. No article for the real retail-tier methodology existed under any slug.
  # Worse, the one place a scoring mechanism WAS described in detail
  # (app-orchestration-gis.md) described a Haversine linear-decay formula the real
  # SCORING-METHODOLOGY.md (V3, verified) confirms was removed and replaced by a
  # 4-tier predicate-gate system — and 2 more articles in the cluster each described
  # the mechanism differently, with neither matching the real system. Fixed by
  # creating substrate/retail-co-location-tier-methodology.md as the single source of
  # truth (real facts only, from the verified V3 methodology doc) and repointing all
  # citing articles to it instead of re-describing the mechanism themselves.
  - from: /services/pointsav-gis-engine
    to: /substrate/location-intelligence-substrate

